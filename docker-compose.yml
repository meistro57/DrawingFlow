services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: drawingflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - drawingflow
    depends_on:
      - mysql
      - redis

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: drawingflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/tls.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/tls.key}
      TLS_CERT_CN: ${TLS_CERT_CN:-localhost}
      TLS_CERT_SAN: ${TLS_CERT_SAN:-DNS:localhost,DNS:host.docker.internal}
      FORCE_HTTPS_REDIRECT: ${FORCE_HTTPS_REDIRECT:-1}
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./docker/nginx/certs:/etc/nginx/certs
    networks:
      - drawingflow
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: drawingflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drawingflow
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: drawingflow
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - drawingflow

  redis:
    image: redis:7-alpine
    container_name: drawingflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - drawingflow

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: drawingflow-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: drawingflow_search_key
      MEILI_NO_ANALYTICS: true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - drawingflow

  mailhog:
    image: mailhog/mailhog:latest
    container_name: drawingflow-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - drawingflow

networks:
  drawingflow:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  meilisearch-data:
    driver: local
