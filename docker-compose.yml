services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: drawingflow-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - drawingflow
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: drawingflow-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - drawingflow
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: drawingflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drawingflow
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: drawingflow
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - drawingflow

  redis:
    image: redis:7-alpine
    container_name: drawingflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - drawingflow

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: drawingflow-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: drawingflow_search_key
      MEILI_NO_ANALYTICS: true
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - drawingflow

  mailhog:
    image: mailhog/mailhog:latest
    container_name: drawingflow-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - drawingflow

networks:
  drawingflow:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  meilisearch-data:
    driver: local
